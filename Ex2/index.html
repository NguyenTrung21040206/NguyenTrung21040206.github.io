<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <form>
            <fieldset>
                <div class="header">
                    <img src="C:\Image\logoIU.png" alt="IU Logo" class="logo">
                    <h2>Survey</h2>
                </div>
                <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
            </fieldset>

            <fieldset>
                <legend>Your information:</legend>

                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname">

                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </fieldset>

            <fieldset>
                <legend>How did you hear about us?</legend>
                <label><input type="radio" name="source" value="search"> Search engine</label>
                <label><input type="radio" name="source" value="word"> Word of mouth</label>
                <label><input type="radio" name="source" value="social"> Social Media</label>
                <label><input type="radio" name="source" value="other"> Other</label>
            </fieldset>

            <fieldset>
                <legend>Would you like to receive announcements about new CDs and special offers?</legend>
                <label><input type="checkbox" name="announce1"> YES, I'd like that.</label><br>
                <label><input type="checkbox" name="announce2"> YES, please send me email announcements.</label>

                <div class="contact-row">
                    <label for="contact">Please contact me by:</label>
                    <select id="contact" name="contact">
                        <option>Email or postal mail</option>
                        <option>Email only</option>
                        <option>Postal mail only</option>
                    </select>
                </div>

            </fieldset>

            <input type="submit" value="Submit" class="btn">
        </form>
    </div>
</body>

</html>
